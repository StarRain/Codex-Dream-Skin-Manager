name: Feature Request / 功能建议
description: Propose an improvement before implementation / 在实现前提出改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。较大的功能请先讨论并确认范围，再开始提交代码。
        Thank you for the idea. Please discuss and agree on scope before implementing a substantial change.
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What user problem or limitation does this address? / 这个建议解决什么用户问题或现有限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: Describe the behavior, UI, or API you propose. / 描述建议的行为、界面或 API。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 备选方案
      description: What other approaches have you considered? / 还考虑过哪些实现方式？
  - type: dropdown
    id: scope
    attributes:
      label: Scope / 影响范围
      options:
        - WebUI only / 仅 WebUI
        - Host Agent only / 仅 Host Agent
        - Theme engine integration / 主题引擎集成
        - Installation or deployment / 安装或部署
        - Documentation / 文档
        - Multiple components / 多个组件
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution / 参与实现
      options:
        - label: I am willing to submit a Pull Request. / 我愿意提交 Pull Request。
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues and feature requests. / 我已搜索现有 Issue 和功能建议。
          required: true
        - label: This request stays within the project's local-first macOS scope. / 该建议符合项目本地优先的 macOS 定位。
          required: true
